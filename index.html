<div id="app">
 <div id="screen"><div id="light"></div><div id="dark"></div><div id="ui"></div><div id="fade"></div></div>
 <div id="pad">
  <div id="joy"><div id="knob"></div></div>
  <div class="btn" id="bA" data-k="a">⚔<small>SERANG</small></div>
  <div class="btn" id="bB" data-k="b">✦<small>SIHIR</small></div>
  <div class="btn" id="bI" data-k="item">♥<small>OBAT</small></div>
  <div class="btn" id="bT" data-k="bag">TAS</div>
  <div class="btn" id="bD" data-k="dash">»<small>DASH</small></div>
  <div class="btn tool" id="bX1" data-k="tool1" style="display:none"></div>
  <div class="btn tool" id="bX2" data-k="tool2" style="display:none"></div>
  <div class="btn" id="bM" data-k="menu">MENU</div>
  <div class="btn" id="bP" data-k="map">PETA</div>
 </div>
 <div id="keys">Panah/WASD: jalan · Z/J/Spasi: serang & bicara · X/K: sihir api · Q: minum ramuan · Esc: menu · M/Tab: peta · I: tas · Shift: dash · C: nova es · tahan Z: tebasan putar</div>
</div>
