<style>
/* Gaya UI: jendela, HUD, menu, kontrol sentuh */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#13201a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Pixelify Sans','Courier New',monospace;color:#3b2618}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(ellipse at 50% 30%,#2a4a32 0%,#101a14 75%)}
#screen{position:relative;overflow:hidden;background:#000;box-shadow:0 0 0 3px #5e3b20,0 0 0 5px #2a1a10,0 12px 30px rgba(0,0,0,.6);border-radius:3px;flex:none}
#screen>canvas{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important;margin:0!important;image-rendering:pixelated;image-rendering:crisp-edges}
#light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,rgba(255,248,210,.10) 0%,rgba(255,240,200,0) 55%,rgba(10,30,15,.22) 100%)}
#dark{position:absolute;inset:0;pointer-events:none;display:none}
#ui{position:absolute;left:0;top:0;width:288px;height:224px;transform-origin:0 0;font-size:10px;line-height:1.3;pointer-events:none}
#ui .act{pointer-events:auto}
#fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity .35s;pointer-events:none}
.win{position:absolute;background:#fbf1d9;border:2px solid #6e4222;border-radius:4px;box-shadow:0 0 0 1px #2a1a10,inset 0 0 0 1px #e2c99a,0 3px 0 rgba(0,0,0,.35);padding:4px 7px;color:#3b2618}
.opt{position:relative;padding-left:10px;white-space:nowrap;display:flex;justify-content:space-between;gap:10px;height:14px;line-height:14px;cursor:pointer}
.opt.sel{color:#000}
.opt.sel::before{content:'';position:absolute;left:0;top:4px;border-left:6px solid #d0582a;border-top:3px solid transparent;border-bottom:3px solid transparent;animation:blink .8s steps(2) infinite}
.opt.dis{color:#a8957a}
.opt span{color:#8a6a4a}
.mh{color:#a0481e;font-weight:600;margin-bottom:2px}
.mf{color:#7a5a3a;font-size:9px;margin-top:3px;border-top:1px dashed #c8a878;padding-top:2px;white-space:normal;line-height:11px}
.dlg{left:6px;right:6px;bottom:6px;min-height:50px;font-size:10.5px;line-height:13px;padding:6px 9px}
.dlg .tx{white-space:pre-wrap}
.dlg .nm{position:absolute;left:6px;top:-12px;background:#5aa04a;border:2px solid #2e6a28;border-radius:4px;padding:0 6px;font-size:9px;line-height:11px;color:#fff;text-shadow:1px 1px 0 #2e6a28}
.more{position:absolute;right:7px;bottom:3px;color:#d0582a;font-size:8px;opacity:0}
.done .more{opacity:1;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(2px)}}
@keyframes blink{50%{opacity:.25}}
#hud{position:absolute;left:4px;top:4px;display:flex;gap:4px;align-items:center;background:rgba(30,20,12,.62);border:1px solid rgba(255,230,180,.35);border-radius:4px;padding:3px 5px 3px 4px;color:#fff;transition:opacity .3s}
#hud .lv{font-size:8px;line-height:9px;text-align:center;color:#ffe27a;font-weight:700;width:18px}
#hud .lv b{display:block;font-size:12px;line-height:12px;color:#fff}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{position:relative;width:66px;height:7px;background:#2a1a12;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#9cf07a,#3cae3a);transition:width .25s}
.bar.mp>i{background:linear-gradient(#a8e4ff,#3a8ee0)}
.bar.xp{height:3px}.bar.xp>i{background:linear-gradient(#fff0a0,#e0a82a)}
.bar.low>i{background:linear-gradient(#ffb08a,#e0582a)}
.bar>span{position:absolute;right:2px;top:-1px;font-size:7px;line-height:9px;color:#fff;text-shadow:1px 1px 0 #000}
#hud2{position:absolute;right:4px;top:4px;display:flex;gap:6px;align-items:center;background:rgba(30,20,12,.62);border:1px solid rgba(255,230,180,.35);border-radius:4px;padding:2px 6px;color:#fff;font-size:10px;transition:opacity .3s}
#hud2 img{width:10px;height:10px;image-rendering:pixelated;vertical-align:-1px;margin-right:2px}
#hud2 .pt img{width:9px;height:11px}
#quest{position:absolute;right:4px;top:22px;max-width:130px;text-align:right;font-size:8px;line-height:10px;color:#fff;text-shadow:1px 1px 0 #000,0 0 3px #000;transition:opacity .3s}
#quest b{color:#ffe27a}
#boss{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:180px;text-align:center;color:#fff;font-size:9px;text-shadow:1px 1px 0 #000;display:none}
#boss .bar{width:180px;height:8px;margin-top:1px}
#boss .bar>i{background:linear-gradient(#ff9a8a,#c8282a)}
.pop{position:absolute;font-weight:700;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000,1px 0 0 #000;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;animation:pop .9s ease-out forwards}
.pop.hurt{color:#ff6a6a}.pop.heal{color:#8dff9f}.pop.mpc{color:#8fd8ff}.pop.crit{color:#ffe66b;font-size:14px}.pop.gold{color:#ffe27a;font-size:9px}.pop.xp{color:#c8e8ff;font-size:8px}
@keyframes pop{0%{opacity:0;margin-top:4px;scale:.5}15%{opacity:1;margin-top:-5px;scale:1.25}30%{margin-top:-6px;scale:1}75%{opacity:1}100%{opacity:0;margin-top:-18px}}
.banner{position:absolute;left:50%;top:44px;transform:translateX(-50%);padding:3px 14px;font-size:12px;font-weight:700;white-space:nowrap;animation:bin .35s ease-out;transition:opacity .5s;text-align:center;color:#3b2618}
.banner small{display:block;font-size:8px;font-weight:400;color:#8a5a32;letter-spacing:2px}
.banner.big{top:70px;font-size:16px;color:#d0582a}
.banner.out{opacity:0}
@keyframes bin{from{opacity:0;transform:translate(-50%,-6px)}}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:26px;background:linear-gradient(rgba(10,20,10,.15),rgba(10,20,10,.45))}
#title .logo{font-size:34px;font-weight:700;letter-spacing:1px;line-height:1;text-align:center;color:#fff3c4;text-shadow:0 2px 0 #d0782a,0 3px 0 #7a3a14,2px 5px 0 rgba(0,0,0,.5)}
#title .logo small{display:block;font-size:10px;letter-spacing:6px;color:#fff;text-shadow:1px 1px 0 #2a1a10;margin-bottom:4px}
#title .sub{margin-top:5px;font-size:9px;letter-spacing:3px;color:#e8ffd0;text-shadow:1px 1px 0 #1a2a10}
#title .menu{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);min-width:110px}
#title .hint{position:absolute;bottom:8px;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.st{display:grid;grid-template-columns:auto auto;column-gap:12px;font-size:10px;line-height:13px}
.st span:nth-child(odd){color:#8a6a4a}
.y{color:#a0481e}
#screen.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,1px)}}
#mapw{left:8px;right:8px;top:8px;bottom:8px;padding:5px 7px;display:flex;flex-direction:column}
#mapw .mh{display:flex;justify-content:space-between}
#mapw .mbox{position:relative;flex:1;margin-top:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#2a1a10;border-radius:3px;box-shadow:inset 0 0 0 1px #6e4222}
#mapw canvas{image-rendering:auto;display:block}
#mapw .mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
#mapw .me{width:7px;height:7px;border-radius:50%;background:#ffe23a;box-shadow:0 0 0 1.5px #3a1a00,0 0 6px #fff;animation:blink .6s steps(2) infinite}
#mapw .mn{width:4px;height:4px;border-radius:50%;background:#7aff7a;box-shadow:0 0 0 1px #0a3a0a}
#mapw .mc{width:5px;height:4px;background:#ffc83a;box-shadow:0 0 0 1px #4a2a00}
#mapw .mb{font-size:9px;line-height:9px;color:#ff4a4a;text-shadow:0 0 2px #000,1px 1px 0 #000}
#mapw .mq{font-size:11px;line-height:11px;color:#ffe23a;text-shadow:0 0 3px #000,1px 1px 0 #000;animation:bob .5s ease-in-out infinite alternate}
#mapw .mx{font-size:7px;line-height:8px;color:#fff;background:rgba(40,20,10,.75);padding:0 3px;border-radius:2px;white-space:nowrap}
#mapw .leg{font-size:8px;color:#7a5a3a;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#mapw .leg i{display:inline-block;margin-right:2px;vertical-align:middle}
#mapw .world{font-size:8px;color:#5e3b20;margin-top:2px}
img.ic{width:12px;height:12px;image-rendering:pixelated;vertical-align:-2px;margin-right:3px}
#bagw{left:6px;right:6px;top:6px;bottom:6px;padding:4px 6px;display:flex;flex-direction:column}
#bagw .bt{display:flex;gap:3px;align-items:center;border-bottom:1px dashed #c8a878;padding-bottom:3px}
#bagw .tb{padding:1px 5px;border-radius:3px;font-size:9px;color:#8a6a4a;cursor:pointer}
#bagw .tb.on{background:#6e4222;color:#fff3c4}
#bagw .gold{margin-left:auto;font-size:9px;color:#a0481e}
#bagw .bb{flex:1;display:flex;gap:5px;min-height:0;margin-top:3px}
#bagw .bl{flex:1;overflow:auto;min-height:0}
#bagw .bi{display:flex;align-items:center;gap:2px;height:16px;padding:0 3px;border-radius:2px;font-size:9.5px;cursor:pointer}
#bagw .bi span{flex:1;white-space:nowrap;overflow:hidden}
#bagw .bi b{font-weight:400;color:#8a6a4a;font-size:9px}
#bagw .bi.sel{background:#f0dcae;box-shadow:inset 0 0 0 1px #d0a060}
#bagw .empty{color:#a8957a;font-size:9px;padding:6px}
#bagw .bs{width:104px;border-left:1px dashed #c8a878;padding-left:5px;font-size:9px}
#bagw .bs .mh{margin-bottom:1px}
#bagw .eqs{height:14px;white-space:nowrap;overflow:hidden}
#bagw .eqs i{color:#a8957a}
#bagw .st2{margin-top:3px;line-height:11px;color:#7a5a3a}
#bagw .st2 b{color:#3b2618}
#bagw .bd{border-top:1px dashed #c8a878;padding-top:2px;margin-top:2px;font-size:9px;line-height:11px;min-height:24px;color:#5e3b20}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px}
.bc{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;column-gap:4px;align-items:center;background:#f4e4bc;border-radius:3px;padding:2px 3px;font-size:8.5px;line-height:10px}
.bc img{grid-row:span 2;max-width:22px;max-height:22px;image-rendering:pixelated;justify-self:center}
.bc span{color:#7a5a3a;font-size:7.5px}.bc.boss{background:#f8d4c0}.bc.unk{opacity:.5;grid-template-columns:1fr}
#hClock{font-size:9px;color:#ffe9b0}
.qr{font-size:9px;line-height:11px;margin:3px 0;color:#5e3b20}.qr b{color:#3b2618}.qr.done{opacity:.55}
/* kontrol sentuh */
#pad{position:relative;width:100%;max-width:460px;height:210px;display:none;flex:none}
body.touch #pad{display:block}
#joy{position:absolute;left:18px;top:42px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#3a5a3a 0%,#22382a 70%);box-shadow:inset 0 0 0 3px #4e7a4a,0 5px 0 #0e1a12;touch-action:none}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8f0c0,#7ab45a);box-shadow:0 4px 0 #2e5a2a;pointer-events:none}
.btn{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:24px;line-height:1;color:#fff;text-shadow:0 2px 0 #0006;box-shadow:0 5px 0 #0008,inset 0 2px 0 #fff5;touch-action:none}
.btn small{font-size:8px;letter-spacing:1px;margin-top:2px;font-weight:600}
.btn.on{transform:translateY(3px);box-shadow:0 2px 0 #0008,inset 0 2px 0 #fff5;filter:brightness(1.15)}
#bA{right:18px;top:40px;width:80px;height:80px;background:radial-gradient(circle at 35% 30%,#ff9a7a,#d0482e)}
#bB{right:110px;top:100px;width:62px;height:62px;font-size:20px;background:radial-gradient(circle at 35% 30%,#ffd07a,#e07a1e)}
#bI{right:30px;top:134px;width:52px;height:52px;font-size:16px;background:radial-gradient(circle at 35% 30%,#ff9ab0,#c83a5a)}
#bM{left:calc(50% - 92px);top:4px;width:88px;height:26px;border-radius:13px;font-size:11px;letter-spacing:2px;background:linear-gradient(#8a6a4a,#5e3b20)}
#bD{right:116px;top:40px;width:50px;height:50px;font-size:16px;background:radial-gradient(circle at 35% 30%,#a8e0ff,#3a8ad0)}
#bT{left:calc(50% - 32px);top:178px;width:64px;height:24px;border-radius:12px;font-size:10px;letter-spacing:2px;background:linear-gradient(#a07a4a,#6e4a28)}
#bP{left:calc(50% + 4px);top:4px;width:88px;height:26px;border-radius:13px;font-size:11px;letter-spacing:2px;background:linear-gradient(#5a8a5a,#2e5a2e)}
#keys{color:#a8c8a0;font-size:12px;text-align:center;padding:0 10px}
body.touch #keys{display:none}
@media (orientation:landscape){
 body.touch #pad{position:absolute;inset:0;max-width:none;height:auto;pointer-events:none}
 body.touch #pad>*{pointer-events:auto}
 body.touch #joy{left:20px;top:auto;bottom:26px}
 body.touch #bA{right:20px;top:auto;bottom:70px}
 body.touch #bB{right:110px;top:auto;bottom:24px}
 body.touch #bI{right:24px;top:auto;bottom:4px;width:44px;height:44px}
 body.touch #bM{left:auto;right:18px;top:12px}
 body.touch #bP{left:18px;top:12px}
 body.touch #bT{left:18px;top:46px}
 body.touch #bD{right:122px;top:auto;bottom:96px;width:46px;height:46px}
}
.codew textarea{width:100%;height:88px;font:9px/1.25 monospace;border:1px solid #6e4222;border-radius:3px;background:#fffaf0;color:#3b2618;resize:none;word-break:break-all;user-select:text;-webkit-user-select:text}
.codew .cbtn{display:flex;gap:8px;justify-content:center;margin-top:4px}
.codew .cbtn .opt{padding:2px 12px;border:1px solid #6e4222;border-radius:3px;cursor:pointer}
.jrn{display:flex;flex-direction:column}
.jrn .jb{overflow-y:auto;flex:1;padding-right:2px}
.jrn .jh{font-size:9px;letter-spacing:1px;color:#8a5a2a;margin-top:6px;border-bottom:1px solid #e2c99a}
.jrn .jt{margin:2px 0 2px}
.jrn .jl.sel{background:#f4e2b8;border-radius:3px}
/* kunci zoom: cegah double-tap zoom & cubit di semua elemen */
html,body{touch-action:none;-ms-touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
.codew textarea,.jrn .jb{touch-action:pan-y}
#autosv{position:absolute;right:6px;bottom:6px;font-size:9px;color:#fff;background:rgba(20,16,30,.55);padding:1px 6px;border-radius:6px;opacity:0;pointer-events:none;z-index:40}
#autosv.on{animation:asv 2.2s ease}
@keyframes asv{0%,100%{opacity:0}15%,70%{opacity:1}}
/* kartu misi */
#quest{pointer-events:auto!important;cursor:pointer;background:rgba(28,20,36,.72);border:1px solid #e8c050;border-radius:6px;padding:3px 7px 3px;max-width:52%;text-align:left!important;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#quest .qh{font-size:8px;letter-spacing:1px;color:#e8c050}
#quest .qt{font-size:10px;line-height:1.25;color:#fff}
#quest .qp{display:inline-block;background:#e8c050;color:#2a1a10;border-radius:6px;padding:0 4px;font-size:9px;font-weight:bold}
#quest .qf{font-size:7px;color:#b8a8c8;margin-top:1px}
/* balon sapaan otomatis NPC (barking speech bubble) */
.bark{position:absolute;transform:translate(-50%,-100%);background:#fffef5;color:#2a1810;border:1.5px solid #6e4222;border-radius:4px;padding:2px 5px;font-size:8.5px;line-height:10.5px;white-space:nowrap;pointer-events:none;z-index:9000;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:barkPop .25s ease-out forwards;max-width:130px;white-space:normal;text-align:center}
.bark::after{content:'';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid #6e4222}
@keyframes barkPop{0%{opacity:0;transform:translate(-50%,-90%) scale(.7)}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}

/* tips tutorial */
#tip{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(86%,330px);background:rgba(28,20,36,.9);border:1px solid #e8c050;border-radius:8px;color:#fff;font-size:11px;line-height:1.35;padding:6px 9px;z-index:60;pointer-events:auto;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:tipin .3s ease}
#tip b{color:#ffd84a}#tip small{display:block;font-size:8px;color:#b8a8c8;margin-top:2px}#tip.off{opacity:0;transition:opacity .3s}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
/* peta mini */
#mini{position:absolute;left:6px;top:58px;width:72px;height:72px;border:1px solid #e8c050;border-radius:6px;background:rgba(20,16,30,.55);z-index:1;pointer-events:auto;image-rendering:pixelated}
/* ukuran & transparansi tombol (#74) */
#pad .btn{scale:var(--bs,1);opacity:var(--ba,1)}
/* penanda bahaya dari luar layar */
.danger{position:absolute;pointer-events:none;z-index:25;opacity:0}
.danger.left{left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,rgba(255,40,30,.7),transparent)}
.danger.right{right:0;top:0;bottom:0;width:26px;background:linear-gradient(270deg,rgba(255,40,30,.7),transparent)}
.danger.top{top:0;left:0;right:0;height:26px;background:linear-gradient(180deg,rgba(255,40,30,.7),transparent)}
.danger.bottom{bottom:0;left:0;right:0;height:26px;background:linear-gradient(0deg,rgba(255,40,30,.7),transparent)}
.danger.on{animation:dg .6s ease-out}
@keyframes dg{0%{opacity:1}100%{opacity:0}}
/* slot alat cepat (#30) */
.btn.tool{width:40px;height:40px;font-size:10px;background:radial-gradient(circle at 35% 30%,#d8c8a8,#7a5a3a)}
.btn.tool img{width:18px;height:18px;image-rendering:pixelated}.btn.tool small{margin-top:0;font-size:8px}.btn.tool.empty{filter:grayscale(1) brightness(.7)}
#bX1{right:182px;top:46px}#bX2{right:182px;top:96px}
@media (orientation:landscape){ body.touch #bX1{right:178px;top:auto;bottom:30px} body.touch #bX2{right:178px;top:auto;bottom:78px} }
/* peta: zoom, ikon, harta */
#mapw .zb b{display:inline-block;width:22px;height:18px;line-height:18px;text-align:center;margin-left:4px;background:#6e4222;color:#fff;border-radius:3px;pointer-events:auto;cursor:pointer;font-size:13px}
#mapw .mi{font-size:9px;line-height:9px;text-shadow:0 0 2px #fff}
#mapw .mt{font-size:12px;line-height:12px;color:#c8281e;font-weight:700;text-shadow:0 0 2px #fff,1px 1px 0 #fff}
#mapw .mbox{touch-action:none}
#quest .qd{color:#ffd84a;font-weight:700}
/* mancing tarik-ulur */
#tug{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(88%,330px);background:rgba(20,30,44,.92);border:1px solid #6ab0d8;border-radius:8px;padding:6px 9px;color:#fff;font-size:11px;z-index:70;pointer-events:auto}
#tug .tg-h{font-weight:700;color:#9ad0f0;margin-bottom:4px}#tug .tg-h small{display:block;font-weight:400;font-size:8px;color:#a8b8c8}
#tug .tg-row{display:flex;align-items:center;gap:6px;margin:3px 0}#tug .tg-row span{width:40px;font-size:9px}
#tug .tg-bar{flex:1;height:9px;background:#0a141e;border-radius:5px;overflow:hidden;border:1px solid #2a4a6a}
#tug .tg-t{display:block;height:100%;background:#ffd84a;transition:background .1s}#tug .tg-t.hot{background:#e84a3a}
#tug .tg-p{display:block;height:100%;background:#5fbf68}
#tug.pull{animation:tugshake .12s infinite}@keyframes tugshake{0%,100%{margin-left:0}50%{margin-left:2px}}
.bc .fic{height:22px;display:flex;align-items:center;justify-content:center;font-size:14px}.bc .fic img{width:20px;height:20px;image-rendering:pixelated}
.bc .fx{font-size:8px;color:#7a5a3a;margin-top:1px}.bc .fh{font-size:7px;line-height:1.25;color:#8a7a6a;margin-top:2px}
</style>

// UI DOM: dialog (say/talk), menu (choose/ask), banner, angka melayang, HUD
// =====================================================================
//  UI (DOM di atas kanvas): dialog, menu, HUD, angka kerusakan
// =====================================================================
let UIH = null;            // handler input aktif untuk UI (null = gameplay)
const G = { lock: 0, title: true, scene: null };
function win(cls, html = '') { const d = document.createElement('div'); d.className = 'win ' + cls; d.innerHTML = html; UI.appendChild(d); return d; }
function fadeTo(v) { FADE.style.opacity = v; return sleep(360); }
function shake() { if (!OPT.shake) return; SCREEN.classList.remove('shake'); void SCREEN.offsetWidth; SCREEN.classList.add('shake'); }

// ---- dialog ----
// Catatan: say(teks, nama) & choose({ head, items }). Format lama/salah dari agent lain juga diterima agar layar tidak membeku:
//   say('Nama', ['baris', ...])  → dialog beberapa baris;  choose('Judul', ['opsi', ...])  → menu
const DLG_LOG = []; // riwayat dialog (fitur #880)
function say(text, name) {
  if (Array.isArray(name)) return talk(text, name);
  if (Array.isArray(text)) return talk(name || null, text);
  DLG_LOG.push({ name: name || '', text: String(text) }); if (DLG_LOG.length > 60) DLG_LOG.shift();
  return new Promise(res => {
    const prev = UIH;
    const w = win('dlg act', (name ? `<div class="nm">${name}</div>` : '') + '<div class="tx"></div><div class="more">▼</div>');
    const tx = w.querySelector('.tx'); let i = 0, done = false;

// Penyelidikan jangka menengah, mengikuti tahap cerita
function midGoal() {
  const s = S.stage;
  if (s < 5) return 'Kenapa monster di sekitar desa mengamuk, dan kenapa Kristal Lumina meredup?';
  if (s < 9) return 'Siapa Morgath, dan kenapa ia mengincar Lumina?';
  if (s < 14) return 'Siapa yang membangunkan naga es di utara?';
  if (s < 19) return 'Mimpi buruk apa yang menghantui penduduk desa?';
  if (s < 27) return 'Apa yang disimpan Akademi Cahaya tentang para Penjaga, dan tentang wanita dalam mimpi?';
  return 'Siapa yang mengambil catatan tambang Lembah Besi dari arsip, dan kenapa kristal-kristal meredup?';
}
function learn(id) {
  if (!LORE[id] || S.lore[id]) return false;
  const before = MYSTERY.filter(m => m.open()).length; S.lore[id] = 1; sfx('save');
  const after = MYSTERY.filter(m => m.open()).length;
  banner(LORE[id][1], after > before ? 'MISTERI BARU · JURNAL' : 'JURNAL DIPERBARUI', false, 2000);
  return true;
}

const SHC = {};
function bakeGround(sc, M) {
  const g = genGround(M); if (M.indoor) return g;
  const [c, x] = mk(M.w, M.h); x.drawImage(g, 0, 0);
  x.globalAlpha = M.dark ? .55 : .36;
  for (const o of mapObjects(M).slice().sort((a, b) => a[2] - b[2])) {
    const d = OBJ[o[0]]; if (!d.sh) continue;
    let C = SHC[d.key]; if (!C) { const tex = sc.textures.get(d.key), f = tex.has(0) ? tex.get(0) : tex.get(); C = SHC[d.key] = shadowCanvas(tex.getSourceImage(), f.cutX, f.cutY, f.cutWidth, f.cutHeight); C.w = f.cutWidth; }
    x.drawImage(C.c, Math.round(o[1] - C.w / 2 - C.pad), Math.round(o[2] + 3 - C.shH - C.pad));

}

  },

    const g = this.iceG; this.iceG = null; this.sparkle(g.x, g.y - 12, 'dot', 24);

  // Naga Es: kejar, terjang, semburan es berbentuk kipas, fase 2: panggil bantuan + hujan es melingkar + hentakan
  updDragon(e, dt, dx, dy, d) {
    const s = e.spr, D = e.D; if (!e.awake) { s.setVelocity(0); return; }
    if (!e.summoned && e.hp < e.max * .5) { this.summon(e); e.spdM = 1.35; return; }
    if (e.st === 'roar') { s.setVelocity(0); if (e.t <= 0) { s.clearTint(); e.st = 'idle'; e.t = .8; } return; }
    s.anims.timeScale = e.st === 'dash' ? 3 : 1.2;
    const m = e.spdM || 1;
    if (e.st === 'idle' || e.st === 'chase') {
      e.st = 'chase'; s.setVelocity(dx / d * D.spd * .8 * m, dy / d * D.spd * .8 * m); s.flipX = dx > 0;
      if (e.t <= 0) {
        s.setVelocity(0); e.lx = dx / d; e.ly = dy / d; const r = Math.random();
        if (d < 140 && r < .35) { e.st = 'wind'; e.t = .5; s.setTint(0xa8e0ff); }
        else if (r < .7) { e.st = 'breath'; e.t = .55; s.setTint(0xd8f4ff); sfx('ice'); }
        else if (e.summoned) { e.st = 'stomp'; e.t = .6; s.setTint(0xffe0a0); }
        else { e.st = 'ring'; e.t = .6; s.setTint(0x8ad0ff); }
      }
    } else if (e.st === 'wind') { if (e.t <= 0) { e.st = 'dash'; e.t = .55; s.clearTint(); s.setVelocity(e.lx * 280 * m, e.ly * 280 * m); sfx('swing'); } }
    else if (e.st === 'dash') { if (e.t <= 0 || s.body.blocked.left || s.body.blocked.right || s.body.blocked.up || s.body.blocked.down) { e.st = 'rec'; e.t = .6; s.setVelocity(0); } }
    else if (e.st === 'breath') { if (e.t <= 0) { s.clearTint(); this.eShoot(e, 'ice', e.summoned ? [-.5, -.3, -.1, .1, .3, .5] : [-.36, -.12, .12, .36], D.atk - 6); e.st = 'rec'; e.t = .55; } }
    else if (e.st === 'ring') { if (e.t <= 0) { s.clearTint(); this.eShoot(e, 'ice', [...Array(10).keys()].map(i => i / 10 * Math.PI * 2 + this.t), D.atk - 8, true); e.st = 'rec'; e.t = .7; } }
    else if (e.st === 'stomp') { if (e.t <= 0) { s.clearTint(); this.shockwave(s.x, s.y, 78, D.atk); e.st = 'rec'; e.t = .8; } }
    else if (e.st === 'rec') { s.setVelocity(0); if (e.t <= 0) { e.st = 'chase'; e.t = rnd(1, 1.7) / m; } }
  },
});

    await say("Boris si Raksasa Pasar", [
      "Wahahaha! Selamat datang di Tiang Uji Tenaga Martil Gong Pasar Kota Lumina!",
      "Hanya mereka yang memiliki sentakan otot baja yang sanggup membuat gong puncak berdentang! Taruhan 15 Koin Emas untuk satu ayunan godam!"
    ]);

    const c = await choose("Uji Kekuatan Pukul Martil Gong", [
      "🔨 Ayun Martil Godam Sekuat Tenaga (Taruhan 15G)",
      "💪 Tanya Tips Ayunan Boris",
      "Mundur Dulu"
    ]);

    if (c === 1) {
      await say("Boris si Raksasa Pasar", [
        "Kuncinya adalah mengunci pandangan pada meteran tenaga yang melesat naik turun!",
        "Tepat saat meteran menyentuh puncak teratas (warna emas), hantamkan godam secepat kilat dengan tombol aksi [A]!"
      ]);
      return;
    }

    if (c !== 0) return;

    if (S.g < 15) {
      await say("Boris si Raksasa Pasar", [
        "Koinmu kurang dari 15G, sobat! Pasar butuh koin untuk hadiah turnamen, cari koin dulu sana!"
      ]);
      return;
    }

    S.g -= 15;
    sfx("coin");
    this._busyHighStriker = true;
    G.lock++;

    this.popWorld(this.p.x, this.p.y - 18, "Mengangkat martil godam...", "#ffd54f");
    await sleep(700);

    // Vertical oscillation power meter
    const meterW = 14, meterH = 90;
    const cx = VW / 2, cy = VH / 2 - 10;

    const bgBox = this.add.rectangle(cx, cy, meterW + 18, meterH + 24, 0x1a1a24, 0.85).setScrollFactor(0).setDepth(2000);
    const meterBg = this.add.rectangle(cx, cy, meterW, meterH, 0x37474f).setScrollFactor(0).setDepth(2001);
    // Green top bullseye zone
    const topZone = this.add.rectangle(cx, cy - meterH / 2 + 10, meterW, 18, 0xffd54f).setScrollFactor(0).setDepth(2002);
    // Mid zone
    const midZone = this.add.rectangle(cx, cy - 8, meterW, 30, 0x43a047).setScrollFactor(0).setDepth(2003);
    // Moving slider bar
    const slider = this.add.rectangle(cx, cy, meterW + 4, 5, 0xff1744).setScrollFactor(0).setDepth(2004);
    const label = this.add.text(cx, cy - meterH / 2 - 16, "TEKAN [A] PADA PUNCAK!", {
      fontFamily: "sans-serif", fontSize: "9px", color: "#ffffaa", fontStyle: "bold", stroke: "#000", strokeThickness: 2
    }).setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(2005);

    let swung = false;
    let barY = 0; // -40 (top) to +40 (bottom)
    let speed = 2.6 + rnd(0, 0.8);
    let dir = -1;

    const onSwing = () => {
      if (swung) return;
      swung = true;
    };

    const spaceKey = this.input.keyboard.addKey("SPACE");
    const jKey = this.input.keyboard.addKey("J");
    const zKey = this.input.keyboard.addKey("Z");
    spaceKey.on("down", onSwing);
    jKey.on("down", onSwing);
    zKey.on("down", onSwing);

    const tapZone = this.add.zone(0, 0, VW, VH).setOrigin(0, 0).setScrollFactor(0).setInteractive().setDepth(1999);
    tapZone.on("pointerdown", onSwing);

    while (!swung) {
      await sleep(20);
      barY += speed * dir;
      if (barY < -38) { barY = -38; dir = 1; }
      if (barY > 38) { barY = 38; dir = -1; }
      slider.y = cy + barY;
    }

    spaceKey.off("down", onSwing);
    jKey.off("down", onSwing);
    zKey.off("down", onSwing);
    tapZone.destroy();
    bgBox.destroy();
    meterBg.destroy();
    topZone.destroy();
    midZone.destroy();
    slider.destroy();
    label.destroy();

    sfx("swing");
    await sleep(250);
    sfx("crit");
    this.cameras.main.shake(300, 0.015);

    // Slug sliding up animation
    const slug = this.add.circle(sx, sy + 10, 3, 0xffca28).setDepth(sy + 10);
    const distFromTop = Math.abs(barY - (-38));
    const isJackpot = distFromTop <= 7;
    const isMedium = distFromTop <= 26;

    const targetY = isJackpot ? sy - 38 : (isMedium ? sy - 18 : sy - 2);

    this.tweens.add({
      targets: slug,
      y: targetY,
      duration: 500,
      ease: "Quad.easeOut",
      onComplete: () => {
        if (isJackpot) {
          sfx("bell");
          sfx("crit");
          this.popWorld(sx, sy - 42, "🔔 DENTANG GONG! (100 POIN!)", "#ffff55");
        } else if (isMedium) {
          sfx("step");
          this.popWorld(sx, sy - 22, "Kuat! (70 Poin)", "#81c784");
        } else {
          sfx("hurt");
          this.popWorld(sx, sy - 12, "Lumayan! (40 Poin)", "#ffb74d");
        }
        setTimeout(() => slug.destroy(), 1200);
      }
    });

    await sleep(900);
    G.lock--;
    this._busyHighStriker = false;

    if (isJackpot) {
      sfx("chest");
      S.g += 40;
      addItem("mini_trophy", 1);
      if (!S.buff) S.buff = {};
      S.buff.atk = Math.max(S.buff.atk || 0, 180);
      this.popWorld(this.p.x, this.p.y - 18, "🏆 JUARA PUKUL GONG! (+40G)", "#ffff55");
      await say("Gong Puncak Berdentang!", [
        "KLAAANNGGG!! Dentangan gong tembaga membahana ke seluruh penjuru alun-alun pasar!",
        "Para pengunjung dan pedagang pasar menoleh dan bersorak kagum!",
        "Boris tertawa bangga: \"GILA! Tenaga monster! Ambillah 40 Koin Emas ini dan Piala Martil Emas sebagai bukti kekuatan fisikmu (Buff ATK 3 menit)!\""
      ]);
    } else if (isMedium) {
      sfx("coin");
      S.g += 20;
      this.popWorld(this.p.x, this.p.y - 18, "Pukulan Mantap! (+20G)", "#81c784");
      await say("Hantaman Bertenaga", [
        "Peluru timah melesat tinggi hingga mencapai tiga perempat tiang menara!",
        "Boris: \"Ototmu mantap sekali anak muda! Tinggal sedikit lagi sentakan! Ini hadiah koin 20G untukmu!\""
      ]);
    } else {
      addItem("apple", 1);
      this.popWorld(this.p.x, this.p.y - 18, "Hadiah Hiburan (+1 Apel)", "#ffb74d");
      await say("Ayunan Permulaan", [
        "Peluru timah meluncur sampai separuh tiang sebelum jatuh kembali.",
        "Boris: \"Hahaha! Ayunan yang lumayan, tapi ototmu butuh sarapan lebih banyak! Nih makan sebutir Apel Segar manis biar tenagamu berlipat!\""
      ]);
    }
  },

      ]);

      "SIAP... MULAI! (Tekan tombol AKSI / [A] secepat mungkin untuk menekan lengan Bargo ke meja!)"
    ]);

    // Meter overlay on screen
    let power = 0; // -50 (Bargo wins) to +50 (Player wins)
    const meterW = 120, meterH = 14;
    const cx = VW / 2, cy = VH / 2 - 20;

    const bgBox = this.add.rectangle(cx, cy, meterW + 8, meterH + 20, 0x1a1a24, 0.85).setScrollFactor(0).setDepth(2000);
    const meterBg = this.add.rectangle(cx, cy, meterW, meterH, 0x333344).setScrollFactor(0).setDepth(2001);

    const label = this.add.text(cx, cy - 18, "TEKAN [A] SECEPATNYA!", {
      fontFamily: "sans-serif", fontSize: "10px", color: "#ffffaa", fontStyle: "bold", stroke: "#000", strokeThickness: 2
    }).setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(2004);

    let finished = false;
    let won = false;

    // Key listener for button mash (Input A)
    const onKeyA = () => {
      if (finished) return;
      power += 7.5;
      sfx("step");
      if (power > 50) power = 50;
      bar.x = cx + (power / 50) * (meterW / 2);
      if (power >= 48) {
        finished = true;
        won = true;
      }
    };

    // Bind to scene input or keyboard
    const spaceKey = this.input.keyboard.addKey("SPACE");
    const jKey = this.input.keyboard.addKey("J");
    const zKey = this.input.keyboard.addKey("Z");
    spaceKey.on("down", onKeyA);
    jKey.on("down", onKeyA);
    zKey.on("down", onKeyA);

    // Also virtual button A support via UI tap
    const tapZone = this.add.zone(0, 0, VW, VH).setOrigin(0, 0).setScrollFactor(0).setInteractive().setDepth(1999);
    tapZone.on("pointerdown", onKeyA);

    const startTime = Date.now();
    const duration = 6500; // 6.5 seconds

    // Game loop simulation
    while (!finished && (Date.now() - startTime < duration)) {
      await sleep(100);
      // Bargo pushes back with resistance
      power -= 2.6 + rnd(0, 1.8);
      if (power < -50) power = -50;
      bar.x = cx + (power / 50) * (meterW / 2);
      bar.setFillStyle(power > 0 ? 0x55ff55 : 0xff5555);

      if (power <= -48) {
        finished = true;
        won = false;
        break;

  spawnGarden() {

  plotState(i) { const p = S.garden[i]; if (!p) return 'empty'; return gameHours() - p.t >= plotHours(p) ? 'ripe' : 'grow'; },

  updBoulder(dt) {
    const pl = this.pl, b = this.boulder; if (!b || this.bMoving || S.flags.cave_gate) return;
    const v = Input.vec(), dx = b.x - pl.x, dy = (b.y - 5) - (pl.y - 3); let dir = null;
    if (Math.abs(dy) < 10 && Math.abs(dx) < 18 && Math.abs(v.x) > .6) dir = [Math.sign(v.x), 0];
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 15 && Math.abs(v.y) > .6) dir = [0, Math.sign(v.y)];
    if (dir && dir[0] * dx + dir[1] * dy <= 0) dir = null;
    if (!dir) { this.push = 0; return; }
    this.push += dt; if (this.push < .25) return; this.push = 0;
    const nx = b.x + dir[0] * 16, ny = b.y + dir[1] * 16;
    if (this.physics.overlapRect(nx - 7, ny - 9, 14, 8, false, true).some(z => z.gameObject !== this.bW)) { sfx('buzz'); return; }
    this.bMoving = true; sfx('step'); this.walls.remove(this.bW, true, true); this.bW = this.wall(nx - 8, ny - 10, 16, 10);
    this.tweens.add({ targets: b, x: nx, y: ny, duration: 220, onComplete: () => { b.setDepth(ny); this.bMoving = false; this.puff(nx, ny); this.checkPlate(); } });

        const addMp = Math.min(st.maxmp - S.mp, 15);

        S.mp += addMp;
        updHud();

          ],

        });

          S.hp = st.maxhp;

  },
  async startChickenRace() {
    G.lock++;
    await say('Kukuruyuuuk! Selamat datang di Lomba Lari Ayam Desa Lumina! Siapa ayam tercepat pilihanmu?', 'Kiki');
    const betCost = 20;
    for (;;) {
      const picks = [
        { t: '1. Si Putih Kilat (Peluang 2x lipat)', r: 'Hadiah 40 G', d: 'Kecepatan stabil dan pantang menyerah.' },
        { t: '2. Si Jago Merah (Peluang 2x lipat)', r: 'Hadiah 40 G', d: 'Cepat berlari, tapi kadang suka mematuk tanah.' },
        { t: '3. Si Belang Lincah (Peluang 3.5x)', r: 'Hadiah 70 G', d: 'Kadang santai, tapi bisa mendadak sprint kilat!' },
        { t: 'Tutup / Batal' }
      ];
      const sel = await choose({
        head: 'TARUHAN LARI AYAM · Biaya: 20 G (Punya: ' + S.gold + ' G)',
        x: 20, y: 25, w: 260,
        items: picks,
        foot: (i) => picks[i].d || 'Kembali menjelajah desa.'
      });
      if (sel < 0 || sel === 3) break;
      if (S.gold < betCost) {
        sfx('buzz');
        await say('Uangmu kurang! Butuh 20 G untuk memasang taruhan ayam jagoanmu.', 'Kiki');
        continue;
      }
      S.gold -= betCost;
      updHud();
      sfx('coin');

      const racers = [
        { name: 'Si Putih Kilat', tex: 'chick0', mult: 2, prize: 40, x: 200, y: 460 },
        { name: 'Si Jago Merah', tex: 'chick1', mult: 2, prize: 40, x: 200, y: 476 },
        { name: 'Si Belang Lincah', tex: 'chick2', mult: 3.5, prize: 70, x: 200, y: 492 },
      ];
      const chosenRacer = racers[sel];
      await say(`Taruhan 20 G dipasang pada ${chosenRacer.name}! Ayo kita menuju garis start!`, 'Kiki');

      // Setup sprite balapan
      const startX = 200, finishX = 350;
      const chickSprites = racers.map((r, idx) => {
        const spr = this.add.sprite(startX, r.y, r.tex, 0).setOrigin(.5, 1).setDepth(r.y + 10);
        spr.play(r.tex + '_mv');
        return spr;
      });

      // Hitung mundur
      sfx('ok');
      popWorld(startX + 60, 440, '3...', 'gold');
      await sleep(600);
      sfx('ok');
      popWorld(startX + 60, 440, '2...', 'gold');
      await sleep(600);
      sfx('ok');
      popWorld(startX + 60, 440, '1...', 'gold');
      await sleep(600);
      sfx('chest');
      popWorld(startX + 60, 440, 'MULAI! PETOOOK!', 'crit');

      // Animasi lari
      let winnerIdx = -1;
      const speeds = [1, 1, 1];
      const xs = [startX, startX, startX];

      while (winnerIdx === -1) {
        await sleep(100);
        for (let i = 0; i < 3; i++) {
          // Kejadian dinamis: sprint atau terhenti matuk
          const r = Math.random();
          if (i === 0) { // Si Putih (konsisten)
            speeds[0] = rnd(3.8, 5.2);
          } else if (i === 1) { // Si Jago Merah (kadang cepat, kadang bengong)
            if (r < 0.2) speeds[1] = 0.5; // bengong
            else if (r > 0.6) speeds[1] = rnd(5.5, 7.0);
            else speeds[1] = rnd(3.5, 5.0);
          } else if (i === 2) { // Si Belang (sprint liar)
            if (r < 0.3) speeds[2] = 1.0;
            else if (r > 0.65) speeds[2] = rnd(6.5, 8.5);
            else speeds[2] = rnd(3.0, 4.5);
          }
          xs[i] += speeds[i];
          chickSprites[i].x = Math.round(xs[i]);
          if (xs[i] >= finishX && winnerIdx === -1) {
            winnerIdx = i;
          }
        }
      }

      await sleep(400);
      const winner = racers[winnerIdx];
      popWorld(finishX, winner.y - 12, 'JUARA 1!', 'gold');
      this.sparkle(finishX, winner.y - 6, 'doto', 14);

      if (winnerIdx === sel) {
        sfx('lvl');
        S.gold += winner.prize;
        updHud();
        this.sparkle(this.pl.x, this.pl.y - 12, 'dotg', 18);
        popWorld(this.pl.x, this.pl.y - 18, `+${winner.prize} G MENANG!`, 'heal');
        await say(`HEBAT SEKALI! ${winner.name} menembus garis finish pertama! Kamu memenangkan hadiah ${winner.prize} G!`, 'Kiki');
        saveGame(this);
      } else {
        sfx('buzz');
        await say(`Pemenangnya adalah ${winner.name}! Ayammu kalah tipis kali ini... Jangan menyerah, ayo tanding lagi!`, 'Kiki');
      }

      // Bersihkan sprite ayam balapan
      chickSprites.forEach(s => s.destroy());
    }
    G.lock--;
  },

  async feedPond(px, py) {
    if (this._feedingPond) return;
    this._feedingPond = true;
    G.lock++;

    // Tentukan opsi pakan yang dimiliki
    const opts = ['Lempar Remah Roti Kering (Gratis)'];
    if (has('seed')) opts.push('Tabur Benih Sayur Segar (1x)');
    if (has('berry')) opts.push('Lempar Buah Beri Manis (1x)');
    opts.push('Batal');

    const choice = await choose('Ingin melempar apa ke air kolam?', opts);
    if (choice === -1 || choice === opts.length - 1) {
      this._feedingPond = false;
      G.lock--;
      return;
    }

    const pl = this.pl;
    const selected = opts[choice];
    let baitName = 'Remah Roti';
    let luckyBonus = 0;

    if (selected.includes('Benih Sayur')) {
      addItem('seed', -1);
      baitName = 'Benih Sayur';
      luckyBonus = 0.2;
      updHud();
    } else if (selected.includes('Buah Beri')) {
      addItem('berry', -1);
      baitName = 'Buah Beri Manis';
      luckyBonus = 0.35;
      updHud();
    }

    // Animasi melempar umpan ke air
    sfx('swing');
    const crumb = this.add.image(pl.x, pl.y - 12, 'dotg').setScale(1.8).setDepth(py + 10);
    this.tweens.add({
      targets: crumb,
      x: px,
      y: py,
      duration: 450,
      ease: 'Quad.easeOut',
      onComplete: () => {
        crumb.destroy();
        sfx('splash');
        this.ripple(px, py);
        this.ripple(px + 8, py - 4);
      }
    });

    await sleep(550);

    // Efek bebek / ikan berenang mendekat
    const hasDuck = !this.M.dark && this.M.id !== 'cave' && this.M.id !== 'swamp';
    let duckSpr = null;
    if (hasDuck) {
      const startX = px + (Math.random() < .5 ? -50 : 50);
      const startY = py + rnd(-10, 10);
      duckSpr = this.add.sprite(startX, startY, Math.random() < .5 ? 'duck0' : 'duck1')
        .play((Math.random() < .5 ? 'duck0' : 'duck1') + '_mv')
        .setDepth(py + 1);
      duckSpr.flipX = startX > px;
      this.ripple(startX, startY);

      this.tweens.add({
        targets: duckSpr,
        x: px + (startX > px ? 14 : -14),
        y: py,
        duration: 700,
        ease: 'Sine.easeOut',
        onComplete: () => {
          sfx('quack');
          popWorld(px, py - 18, '🦆 Kwek! ♥', 'heal');
          this.ripple(px, py);
        }
      });
      await sleep(800);
    } else {
      // Ikan melompat menyambar
      const fishSpr = this.add.image(px, py, 'cr_fish').setDepth(py + 2);
      this.tweens.add({
        targets: fishSpr,
        y: py - 14,
        duration: 250,
        yoyo: true,
        onComplete: () => {
          fishSpr.destroy();
          sfx('splash');
          this.ripple(px, py);
          popWorld(px, py - 16, '🐟 Gluk! ♥', 'heal');
        }
      });
      await sleep(600);
    }

    // Hadiah kejutan dari dasar kolam (koin / cacing umpan / ikan kecil)
    const roll = Math.random() + luckyBonus;
    if (roll > 0.75) {
      const rewardCoin = rnd(4, 9);
      S.gold += rewardCoin;
      sfx('coin');
      updHud();
      this.sparkle(px, py - 8, 'doto', 12);
      await say(`Bebek dan ikan berebut ${baitName}! Gerakan mereka mengaduk dasar kolam hingga memunculkan koin tua berkilau (+${rewardCoin} G)!`, 'Kolam Riak');
    } else if (roll > 0.5 && !has('worm')) {
      addItem('seed', 1);
      sfx('chest');
      updHud();
      await say(`Bebek yang gembira menyelam dan meninggalkan biji tumbuhan air langka di tepian kolam! (+1 Benih Sayur)`, 'Kolam Riak');
    } else {
      await say(`Kawanan bebek dan ikan menikmati ${baitName} dengan riang! Riak-riak air berkilau menyejukkan hati.`, 'Kolam Riak');
    }

    // Bersihkan bebek setelah makan dan berenang pergi
    if (duckSpr) {
      this.tweens.add({
        targets: duckSpr,
        x: duckSpr.x + (duckSpr.flipX ? 60 : -60),
        alpha: 0,
        duration: 1200,
        delay: 500,
        onComplete: () => duckSpr.destroy()
      });
    }

    this._feedingPond = false;
    G.lock--;
  },
  async playTavernDice(dealerX, dealerY) {
    G.lock++;
    await say('Yo, kawan pengelana! Mau menghangatkan malam di kedai dengan lempar dadu gading? Aturannya mudah: tebak angka ganjil atau genap!', 'Bram si Pengelana');

    for (; ;) {
      const choice = await choose({
        head: `Dadu Kedai · Koinmu: ${S.gold} G`,
        x: 60, y: 40, w: 180,
        items: [
          { t: 'Tebak GENAP (Taruhan 10 G)', d: 'Menang jika dadu 2, 4, 6 (hadiah 20 G)' },
          { t: 'Tebak GANJIL (Taruhan 10 G)', d: 'Menang jika dadu 1, 3, 5 (hadiah 20 G)' },
          { t: 'Tebak GENAP (Taruhan 25 G)', d: 'Taruhan sedang (hadiah 50 G)' },
          { t: 'Tebak GANJIL (Taruhan 25 G)', d: 'Taruhan sedang (hadiah 50 G)' },
          { t: 'Aturan Main', d: 'Penjelasan cara bermain dadu kedai' },
          { t: 'Pamit', d: 'Kembali menikmati suasana kedai' }
        ],
        foot: (i) => [
          'Pasang 10 G pada angka genap.',
          'Pasang 10 G pada angka ganjil.',
          'Pasang 25 G pada angka genap.',
          'Pasang 25 G pada angka ganjil.',
          'Dengarkan petunjuk lempar dadu.',
          'Tinggalkan meja dadu.'
        ][i]
      });

      if (choice === -1 || choice === 5) {
        await say('Sampai jumpa di meja dadu berikutnya, kawan! Semoga perjalananmu aman.', 'Bram si Pengelana');
        break;
      }

      if (choice === 4) {
        await say('Dadu berkepala enam dikocok di dalam cangkir kayu. Jika angka yang muncul sesuai tebakanmu (ganjil/genap), kamu membawa pulang hadiah 2x lipat taruhanmu!', 'Aturan Dadu');
        continue;
      }

      let bet = 10;
      let guess = 'even'; // even atau odd
      if (choice === 0) { bet = 10; guess = 'even'; }
      else if (choice === 1) { bet = 10; guess = 'odd'; }
      else if (choice === 2) { bet = 25; guess = 'even'; }
      else if (choice === 3) { bet = 25; guess = 'odd'; }

      if (S.gold < bet) {
        sfx('buzz');
        await say(`Koinmu tidak cukup (${S.gold} G). Kamu butuh minimal ${bet} G untuk taruhan ini!`, 'Bram si Pengelana');
        continue;
      }

      // Potong koin taruhan
      S.gold -= bet;
      updHud();

      const tableX = dealerX - 16;
      const tableY = dealerY + 6;

      // Kocok dadu animasi
      popWorld(tableX, tableY - 14, '🎲 Mengocok...', 'gold');
      const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      for (let i = 0; i < 6; i++) {
        sfx('step');
        const tempVal = rnd(1, 6);
        popWorld(tableX + rnd(-6, 6), tableY - 12 + rnd(-4, 4), diceFaces[tempVal - 1], 'xp');
        await sleep(110);
      }

      // Hasil akhir lemparan dadu
      const result = rnd(1, 6);
      const isEven = (result % 2 === 0);
      const win = (guess === 'even' && isEven) || (guess === 'odd' && !isEven);

      sfx('crit');
      popWorld(tableX, tableY - 20, `${diceFaces[result - 1]} Angka ${result}!`, isEven ? 'heal' : 'crit');
      this.sparkle(tableX, tableY - 10, 'dot', 10);
      await sleep(650);

      const typeTxt = isEven ? 'GENAP' : 'GANJIL';
      if (win) {
        const reward = bet * 2;
        S.gold += reward;
        sfx('chest');
        updHud();
        this.sparkle(tableX, tableY - 12, 'dotg', 18);
        popWorld(this.pl.x, this.pl.y - 18, `🎉 Menang! +${reward} G`, 'heal');
        await say(`Dadu berhenti di angka [${result}] (${typeTxt})! Tebakanmu tepat sekali! Bram menyerahkan ${reward} G dengan senyum lebar: "Luar biasa, instingmu tajam sekali kawan!"`, 'Bram si Pengelana');
      } else {
        sfx('buzz');
        popWorld(this.pl.x, this.pl.y - 18, 'Kalah...', 'xp');
        await say(`Dadu berhenti di angka [${result}] (${typeTxt}). Sayang sekali tebakanmu meleset! Bram tertawa ramah: "Hahaha, dewi keberuntungan tersenyum padaku kali ini! Mau coba putaran lagi, kawan?"`, 'Bram si Pengelana');
      }
    }

    G.lock--;
  },

  async strikeDummy(spr, dx, dy) {
    if (this._dummyStriking) return;

    const pl = this.pl;
    const st = stat();
    const wt = (ITEMS[S.eq.wpn] || {}).wt || 'sword';

    // Arahkan pemain ke arah boneka
    const dir = Math.abs(dx - pl.x) > Math.abs(dy - pl.y) ? (dx > pl.x ? 'right' : 'left') : (dy > pl.y ? 'down' : 'up');
    pl.dir = dir;
    pl.flipX = dir === 'left';
    pl.anims.stop();
    pl.setFrame((dir === 'left' || dir === 'right' ? 'side' : dir) + '3');

    // Suara ayunan dan tebasan
    sfx('swing');
    await sleep(60);

    // Animasi goyang boneka latihan
    this.tweens.add({
      targets: spr,
      angle: dir === 'left' ? -14 : 14,
      duration: 60,
      yoyo: true,
      repeat: 3,
      ease: 'Quad.easeInOut',
      onComplete: () => { spr.angle = 0; }
    });

    // Partikel serpihan jerami
    for (let i = 0; i < 5; i++) {
      const straw = this.add.image(dx + rnd(-6, 6), dy - 14 + rnd(-4, 4), 'dot').setScale(1.2).setTint(0xe0c478).setDepth(dy + 2);
      this.tweens.add({
        targets: straw,
        x: straw.x + rnd(-16, 16),
        y: dy + rnd(2, 8),
        alpha: 0,
        duration: 350 + i * 40,
        onComplete: () => straw.destroy()
      });
    }

    // Kalkulasi hit & combo
    const now = Date.now();
    this._dummyCombo = this._dummyCombo || { count: 0, lastTime: 0 };
    if (now - this._dummyCombo.lastTime < 1800) {
      this._dummyCombo.count++;
    } else {
      this._dummyCombo.count = 1;
    }
    this._dummyCombo.lastTime = now;

    const combo = this._dummyCombo.count;
    const isCrit = Math.random() < 0.3 || combo >= 5;
    const dmg = Math.round(st.atk * (isCrit ? 1.6 : 1.0) * rnd(0.9, 1.15));

    if (isCrit) {
      sfx('crit');
      this.camShake(60, .003);
      popWorld(dx, dy - 26, `🔥 ${dmg}!`, 'crit');
    } else {
      sfx('hit');
      popWorld(dx, dy - 22, `${dmg}`, 'dmg');
    }

    // Banner kombo jika beruntun
    if (combo >= 5) {
      popWorld(dx, dy - 36, `💥 ${combo} HIT COMBO!`, 'heal');
      this.sparkle(dx, dy - 14, 'doto', 12);
      // Hadiah latihan EXP kecil
      if (combo % 5 === 0) {
        this.gainExp(2, pl.x, pl.y);
      }
    } else if (combo >= 2) {
      popWorld(dx, dy - 32, `${combo} Hit!`, 'gold');
    }

    // Komentar penyemangat dari penjaga / murid terdekat
    for (const n of this.npcs || []) {
      const dist = Math.hypot(n.spr.x - dx, n.spr.y - dy);
      if (dist < 200 && typeof popBark === 'function') {
        if (combo >= 5) {
          const praise = n.n.id === 'guard' ? 'Tebasan mantap, Arka! Ototmu makin terlatih!' :
                         n.n.id?.startsWith('ka') ? 'Kombo yang luar biasa! Posturmu sempurna!' :
                         'Wah, serangannya cepat sekali!';
          popBark(n, praise);
        }
        break;
      }
    }

    await sleep(150);
    pl.setFrame((dir === 'left' || dir === 'right' ? 'side' : dir) + '0');
    this._dummyStriking = false;
  },
  async playStoneSkipping(px, py) {
    if (this._skippingStone) return;
    this._skippingStone = true;
    G.lock++;

    const ans = await ask('Ada tumpukan kerikil pipih halus di tepi perairan.\nMau melempar batu pipih melantun di atas air?', 'Lempar Batu Pipih');
    if (!ans) {
      this._skippingStone = false;
      G.lock--;
      return;
    }

    const pl = this.pl;
    // Hadapkan pemain ke arah air
    const targetDir = this.M.id === 'lake' ? (px < 560 ? 'right' : 'left') : 'up';
    pl.dir = targetDir;
    pl.flipX = targetDir === 'left';
    pl.anims.stop();
    pl.setFrame((targetDir === 'left' || targetDir === 'right' ? 'side' : targetDir) + '3');

    popWorld(pl.x, pl.y - 18, '⏱ Bidik Lemparan...', 'gold');
    sfx('cur');

    // Mini-game reaksi waktu tombol 'a'
    const startTime = Date.now();
    let hitTimeDiff = 999;
    const hitPromise = new Promise(resolve => {
      const prevHandler = UIH;
      let resolved = false;
      const h = key => {
        if (resolved) return;
        if (key === 'a' || key === 'tap') {
          resolved = true;
          UIH = prevHandler;
          const elapsed = Date.now() - startTime;
          // Target pas di ~600ms
          hitTimeDiff = Math.abs(elapsed - 600);
          resolve(true);
        }
      };
      h.tap = true;
      UIH = h;
      setTimeout(() => {
        if (!resolved) {
          resolved = true;
          UIH = prevHandler;
          resolve(false);
        }
      }, 1200);
    });

    await hitPromise;

    // Hitung jumlah pantulan
    let skips = 1;
    if (hitTimeDiff < 140) skips = 5;
    else if (hitTimeDiff < 280) skips = 4;
    else if (hitTimeDiff < 450) skips = 3;
    else if (hitTimeDiff < 700) skips = 2;
    else skips = 1;

    sfx('swing');
    await sleep(100);

    // Animasi batu meluncur dan memantul di atas air
    const throwDirX = targetDir === 'left' ? -1 : targetDir === 'right' ? 1 : (Math.random() < .5 ? -0.4 : 0.4);
    const throwDirY = targetDir === 'up' ? -1 : 0.2;
    let currX = px;
    let currY = py;

    for (let k = 1; k <= skips; k++) {
      currX += throwDirX * rnd(18, 28);
      currY += throwDirY * rnd(12, 22);

      const stoneSpr = this.add.image(currX, currY - 6, 'dot').setScale(1.3).setTint(0xc8c2b2).setDepth(currY + 2);
      this.tweens.add({
        targets: stoneSpr,
        y: currY,
        duration: 180,
        yoyo: true,
        ease: 'Quad.easeInOut',
        onComplete: () => {
          stoneSpr.destroy();
          sfx('water');
          this.ripple(currX, currY);
          this.sparkle(currX, currY - 2, 'dot', 4);
        }
      });

      popWorld(currX, currY - 14, `Pantulan ${k}!`, 'xp');
      await sleep(220);
    }

    // Efek akhir lemparan
    if (skips >= 4) {
      sfx('crit');
      this.sparkle(currX, currY - 6, 'dotg', 18);
      popWorld(currX, currY - 24, `🌊 ${skips} Pantulan Sempurna!`, 'heal');

      // Pulihkan MP petualang berkat relaksasi
      const st = stat();
      S.mp = Math.min(st.maxmp, S.mp + 20);
      updHud();

      const roll = Math.random();
      if (roll < 0.35) {
        const coin = rnd(5, 12);
        S.gold += coin;
        sfx('coin');
        updHud();
        await say(`LUAR BIASA! Batu pipih meluncur anggun dan memantul ${skips} kali di permukaan air! Pantulannya menyenggol cangkang kerang kuno mengapung ke tepian (+${coin} G & +20 MP)!`, 'Lempar Batu Pipih');
      } else {
        await say(`HEBAT! Batu pipih meluncur deras membelah riak air dan memantul ${skips} kali berturut-turut! Suasana danau yang tenang memulihkan fokus jiwamu (+20 MP).`, 'Lempar Batu Pipih');
      }
    } else if (skips >= 2) {
      popWorld(currX, currY - 20, `${skips} Pantulan!`, 'gold');
      const st = stat();
      S.mp = Math.min(st.maxmp, S.mp + 10);
      updHud();
      await say(`Batu pipih berhasil memantul ${skips} kali sebelum perlahan tenggelam ke dasar air yang sejuk (+10 MP).`, 'Lempar Batu Pipih');
    } else {
      sfx('splash');
      popWorld(currX, currY - 16, 'Cemplung!', 'dmg');
      await say('PLUP! Batu langsung tenggelam ke dalam air. Lemparan berikutnya coba tekan tombol A lebih tepat waktu saat mengayun.', 'Lempar Batu Pipih');
    }

    pl.setFrame((targetDir === 'left' || targetDir === 'right' ? 'side' : targetDir) + '0');
    this._skippingStone = false;
    G.lock--;
  },

        { s: 'step', delay: 180, offX: 4 },
        { s: 'hit', delay: 360, offX: -3 },
        { s: 'hit', delay: 500, offX: 3 },
        { s: 'crit', delay: 680, offX: 0 }
      ];

      for (const p of pattern) {
        this.time.delayedCall(p.delay, () => {
          sfx(p.s);
          this.sparkle(dx + p.offX + rnd(-6, 6), dy - rnd(8, 20), [0xffd23a, 0xff5a36, 0x58c0ff][rnd(0, 2)]);

          scaleX: 1.12,
          duration: 110,
          yoyo: true,
          repeat: 4,
          ease: 'Quad.easeInOut'
        });

      this.tweens.add({
        targets: this.pl,
        y: this.pl.y - 4,
        duration: 140,
        yoyo: true,
        repeat: 3,
        ease: 'Sine.easeInOut'
      });

        'Hilang sudah semua penat hari ini!'
      ];
      let reacted = 0;
      for (const n of this.npcs || []) {
        const d = Math.hypot(n.spr.x - dx, n.spr.y - dy);

          reacted++;

      S.mp = Math.min(st.maxmp, S.mp + 20);

// Segel kuil, Mochi hilang, kristal, peti harta
Object.assign(World.prototype, {
  async touchBarrier() {
    const n = S.inv.seal || 0;
    if (S.stage < 2) return talk(null, ['Dinding cahaya ungu menutup jalan ke kuil. Ada tiga lubang berbentuk kepingan di tengahnya.']);
    if (n < 3) return talk(null, [`Segel ini butuh 3 Pecahan Segel. Kamu punya ${n}/3.`, 'Pemimpin monster di hutan menyimpannya: perkemahan goblin (timur), kebun jamur (barat daya), sarang ular (tenggara).']);
    G.lock++; addItem('seal', -3); S.flags.seal_open = 1; S.stage = 3; updHud();
    sfx('heal'); this.cameras.main.flash(500, 220, 200, 255); this.sparkle(this.barrier.s.x, this.barrier.s.y - 20, 'dot', 30);
    this.tweens.add({ targets: this.barrier.s, alpha: 0, scaleY: 1.6, duration: 700, onComplete: () => this.barrier.s.destroy() });
    this.walls.remove(this.barrier.w, true, true);
    await sleep(800); banner('Segel terbuka!', 'KUIL KRISTAL', true, 1800); await sleep(1500);
    await say('Ketiga pecahan menyatu dan segel pecah. Hawa jahat terasa dari dalam kuil...'); G.lock--; saveGame(this);
  },
  async takeMochi() {
    G.lock++; sfx('ok'); this.mochi.destroy(); this.inter = this.inter.filter(i => !(i.x === this.M.mochi.x && i.y === this.M.mochi.y));
    S.side.mochi = 2; addItem('mochi'); updHud(); await say('Meong~! Kamu menemukan Mochi, kucing putih Lina. Ia langsung meringkuk di tasmu.'); G.lock--;
  },
  async useCrystal() {
    if (S.stage >= 5) return talk(null, ['Kristal Lumina bersinar hangat. Rasanya tenang sekali di sini.']);
    if (S.stage < 4) return talk(null, ['Kristalnya redup dan dingin. Ada sesuatu yang menyerap cahayanya...']);
    G.lock++; sfx('heal'); this.crystal.setTexture('crystal_lit').play('crystal_lit');
    this.cameras.main.flash(600, 200, 240, 255); this.sparkle(this.crystal.x, this.crystal.y - 16, 'dot', 26);
    const st = stat(); S.hp = st.maxhp; S.mp = st.maxmp; S.stage = 5; updHud();
    await sleep(700); banner('Kristal Lumina pulih!', 'MISI SELESAI', true, 2000); await sleep(1800);
    await say('Cahaya kristal memulihkan seluruh tenagamu.');
    await say('...Tanda berbentuk daun di telapak tanganmu berkedip sesaat, hangat, lalu meredup lagi. Sejak kapan tanda ini bisa menyala?');
    learn('tanda'); await sleep(400);
    await say('Saatnya pulang dan melapor ke Tetua Bram.');
    G.lock--; saveGame(this);
  },
  async openChest(c, spr) {
    if (S.flags[c.id]) return talk(null, ['Petinya sudah kosong.']);
    if (c.lock) {
      if (!has('key')) return talk(null, ['Peti ini terkunci rapat. Lubang kuncinya berkarat... mungkin ada kunci tua di suatu tempat.']);
      addItem('key', -1);
      await say('Kunci Tua berputar... KLIK! Peti terbuka.');
    }
    if (c.locked) {
      if (!has('lockpick')) {
        sfx('buzz');
        return talk(null, ['Peti besi ini terkunci rapat dengan gembok tembaga tua. Kamu butuh Peniti Pembobol (dijual di toko/kota) untuk membukanya!']);
      }
      const ok = await ask('Gunakan 1 Peniti Pembobol untuk membuka gembok peti besi ini?', 'Peti Terkunci', 'Bobol Gembok', 'Tinggalkan');
      if (!ok) return;
      addItem('lockpick', -1);
      sfx('step');
      popWorld(c.x, c.y - 12, 'KREK...', 'gold');
      await sleep(350);
      sfx('crit');
      popWorld(c.x, c.y - 16, 'KLAK!', 'crit');
      await sleep(200);
      await say('Kawat peniti bergerak lincah di dalam lubang kunci... KLIK! Gembok besi berhasil terbongkar!');
    }
    S.flags[c.id] = true; spr.setTexture('chesto'); sfx('chest'); G.lock++;
    this.sparkle(c.x, c.y - 10, 'doto', 12); await sleep(300);
    const G2 = { iron: ['isword', 1], ether2: ['ether', 2], ether3: ['ether', 3], potion2: ['potion', 2], potion3: ['potion', 3], hipotion2: ['hipotion', 2], ring: ['ring', 1], shield: ['cshield', 1], key: ['key', 1], mring: ['mring', 1], antidote3: ['antidote', 3], fspear: ['fspear', 1] }[c.item] || (ITEMS[c.item] && [c.item, 1]);
    let msg;
    if (c.item.startsWith('gold')) { const n = +c.item.slice(4); S.gold += n; msg = `Dapat ${n} G!`; }
    else { addItem(G2[0], G2[1]); const it = ITEMS[G2[0]]; msg = `Dapat ${it.n}${G2[1] > 1 ? ' x' + G2[1] : ''}!` + (it.k === 'wpn' || it.k === 'arm' || it.k === 'acc' ? ' Pasang lewat TAS.' : ''); }
    updHud(); await say(msg); G.lock--;
  },
});

  el.className = 'bark';
  el.textContent = text;

  for (; ;) {
    const r = await choose({ head: title + ' · ' + S.gold + ' G' + (discount < 1 ? ' (Diskon 20%)' : ''), x: 46, y: 30, w: 196, start: sel,
      items: [...list.map(id => {
        const it = ITEMS[id], eq = it.k !== 'use' && it.k !== 'mat';
        const finalPrice = Math.max(1, Math.round(it.price * discount));
        return { t: icon(id) + it.n + (eq ? ownedEq(id) : ` (${S.inv[id] || 0})`), r: finalPrice + ' G', dis: eq && has(id) };
      }), { t: 'Kembali' }],
      foot: i => i < list.length ? ITEMS[list[i]].d : 'Uangmu: ' + S.gold + ' G' });
    if (r < 0 || r === list.length) return; sel = r; const id = list[r], it = ITEMS[id];
    const finalPrice = Math.max(1, Math.round(it.price * discount));

    S.gold -= finalPrice; addItem(id); sfx('coin'); updHud();

  }

        const t = tierOf(k), nx = MASTERY[t]; return `${J.d}${J.mp ? ` (${J.mp} MP)` : ''}<br>Penguasaan ${['', 'I', 'II', 'III'][t]}${t < 3 ? ` · ${S.mast[k] || 0}/${nx} pemakaian` : ' · MAHIR'}${J.kind === 'spell' ? '<br>Pilih: pasang di tombol SIHIR' : ''}`; } });
    if (r < 0 || r >= ids.length) return; sel = r; const k = ids[r];
    if (learned(k) && JURUS[k].kind === 'spell') { S.spell = k; sfx('ok'); } else sfx('cur');
  }
}

async function chooseSlot(mode) {
  const items = [0, 1, 2].map(i => { const f = slotInfo(i); return { t: `Slot ${i + 1}${i === SAVE_SLOT ? ' ★' : ''}`, r: f ? `Lv ${f.lv} · ${f.map}` : '(kosong)', dis: mode === 'load' && !f }; });
  const r = await choose({ head: mode === 'load' ? 'Muat dari slot' : 'Mulai baru di slot', items: [...items, { t: 'Batal' }], x: 30, y: 60, w: 240, foot: i => { if (i > 2) return ''; const f = slotInfo(i); return f ? `${f.gold} G · tersimpan ${f.when}` : 'Slot kosong'; } });
  if (r < 0 || r > 2) return -1;
  if (mode === 'new' && slotInfo(r) && !(await ask(`Slot ${r + 1} sudah berisi. Timpa dengan permainan baru?`))) return -1;
  return r;
}

'use strict';
// Kode save: ekspor/impor progres sebagai teks (pindah perangkat / cadangan)
const CODE_TAG = 'LUMINA1:';
function saveCode() { return CODE_TAG + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function readCode(t) {
  t = (t || '').replace(/\s+/g, ''); if (!t.startsWith(CODE_TAG)) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(CODE_TAG.length))))); return o && o.lv ? o : null; } catch (_) { return null; }
}
// mode 'out': tampilkan kode untuk disalin. mode 'in': tempel kode, kembalikan true jika berhasil dimuat ke localStorage.
function codeDialog(mode) {
  return new Promise(res => {
    G.lock++; const prev = UIH;
    const w = win('menu codew', `<div class="mh">${mode === 'out' ? 'Ekspor Save' : 'Impor Save'}</div>
      <div class="mf" style="margin:2px 0 4px">${mode === 'out' ? 'Salin kode ini dan simpan di tempat aman (catatan, chat ke diri sendiri). Tempel di menu Impor di perangkat lain.' : 'Tempel kode save di bawah. Progres sekarang akan diganti.'}</div>
      <textarea spellcheck="false" ${mode === 'out' ? 'readonly' : 'placeholder="LUMINA1:..."'}></textarea>
      <div class="cbtn"><span class="opt sel" data-a="ok">${mode === 'out' ? 'Salin' : 'Muat'}</span><span class="opt" data-a="x">Tutup</span></div>`);
    Object.assign(w.style, { left: '12px', right: '12px', top: '24px' });
    const ta = w.querySelector('textarea'); if (mode === 'out') ta.value = saveCode();
    ta.addEventListener('keydown', e => e.stopPropagation()); ta.addEventListener('keyup', e => e.stopPropagation());
    const msg = w.querySelector('.mf');
    const done = v => { w.remove(); UIH = prev; G.lock--; res(v); };
    const act = async a => {
      if (a === 'x') return done(false);
      if (mode === 'out') { ta.select(); try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'Tersalin! Simpan kode ini baik-baik.'; } catch (_) { try { document.execCommand('copy'); msg.textContent = 'Tersalin!'; } catch (__) { msg.textContent = 'Tahan teks lalu pilih Salin.'; } } sfx('ok'); return; }
      const o = readCode(ta.value); if (!o) { sfx('buzz'); msg.textContent = 'Kode tidak valid. Pastikan disalin lengkap, diawali LUMINA1:'; return; }
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (_) { }
      sfx('save'); done(true);
    };
    w.querySelectorAll('[data-a]').forEach(b => b.addEventListener('pointerdown', ev => { ev.stopPropagation(); act(b.dataset.a); }));
    UIH = k => { if (k === 'b' || k === 'menu' || k === 'back') done(false); };
    if (mode === 'in') setTimeout(() => ta.focus(), 50);
  });
}

// ---------------- LAYAR JUDUL ----------------
async function titleScreen() {
  const t = document.createElement('div'); t.id = 'title';
  t.innerHTML = `<div class="logo"><small>LEGENDA</small>LUMINA</div><div class="sub">— ACTION RPG —</div><div class="hint">versi ${GAME_VERSION}</div>`;
  UI.appendChild(t); showHud(false);
  const anySlot = [0, 1, 2].some(i => slotInfo(i));
  const r = await choose({ items: [{ t: 'Mulai Baru' }, { t: 'Lanjutkan', dis: !hasSave() }, { t: 'Impor Kode' }, { t: 'Pilih Slot', dis: !anySlot }], start: hasSave() ? 1 : 0, cancel: false, style: { left: '50%', transform: 'translateX(-50%)', bottom: '30px', width: '110px' } });
  if (r === 3) { const s = await chooseSlot('load'); if (s >= 0) setSlot(s); t.remove(); return titleScreen(); }
  if (r === 0 && [0, 1, 2].some(i => slotInfo(i))) { const s = await chooseSlot('new'); if (s < 0) { t.remove(); return titleScreen(); } setSlot(s); }
  if (r === 2) { t.remove(); if (await codeDialog('in')) { location.reload(); return; } return titleScreen(); }
  auInit(); t.remove(); await fadeTo(1);
  if (r === 1 && loadSave()) { G.title = false; G.scene.scene.restart({ map: S.map, x: S.x, y: S.y, dir: S.dir }); }
  else {
    S = newState(); G.title = false;
    G.scene.scene.restart({ map: 'village', x: 512, y: 384, dir: 'up', quiet: true, after: async () => {
      await sleep(500); banner('Desa Lumina', 'SELAMAT DATANG DI', false, 1600); await sleep(1700);
      await talk('Lina', ['Arka! Akhirnya kamu bangun.', 'Tetua Bram mencarimu dari tadi. Beliau ada di rumah pohon besar, tepat di depanmu!']);
    } });
  }
}

// Mulai game Phaser
// Kunci zoom browser (cubit, double-tap, Ctrl+roda, Ctrl +/-). iOS Safari mengabaikan user-scalable=no, jadi perlu JS.
(() => {
  const stop = e => e.preventDefault(), opt = { passive: false };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, stop, opt);
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, opt);
  let last = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - last < 320 && !e.target.closest('textarea')) e.preventDefault(); last = t; }, opt);
  document.addEventListener('dblclick', stop, opt);
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, opt);
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
})();
